[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nls-terminal-two"
version = "0.1.0"
description = "Local promo-budget research pipeline for seven Asian music markets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NLS Records" }]
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<3",
  "requests>=2.31,<3",
  "click>=8.1,<9",
  "joblib>=1.3,<2",
]

[project.scripts]
nls-terminal-two = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
